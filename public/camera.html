<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>휴대폰 카메라 · Tutorial Everywhere</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">T<span>↗</span> <strong>Tutorial Everywhere</strong></a></header><main class="phone"><p class="eyebrow">PHONE CAMERA</p><h1>화면을 비춰 주세요.</h1><p class="muted">카메라 사진을 연결된 노트북으로 전달합니다.<br>AI 분석은 노트북에서 요청할 때만 실행됩니다.</p><div class="frame"><video id="video" autoplay muted playsinline hidden></video><img id="preview" alt="전송한 사진" hidden><div id="placeholder" class="empty"><span>⌗</span><p>키오스크 화면 전체가<br>잘 보이도록 비춰 주세요.</p></div></div><p id="status" role="status">연결 확인 중</p><div class="phone-controls"><button id="start">연속 촬영 시작</button><button id="stop-camera" class="secondary" disabled>촬영 중지</button><label class="file-button">사진 촬영 / 선택<input id="photo" type="file" accept="image/*" capture="environment"></label></div><p id="camera-error" class="error" role="alert"></p><p id="secure-note" class="small-note"></p><p class="caption">카메라 화면을 벗어나면 촬영을 중지합니다. 영상과 사진은 서버 디스크에 저장하지 않습니다.</p></main><script type="module" src="/camera.js"></script></body></html>
